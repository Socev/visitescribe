[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 115200

; CoreS3-Lite hardware: 16 MB QIO flash + 8 MB Quad PSRAM. The generic
; DevKitC board manifest describes a different 8 MB/no-PSRAM board, so both
; the upload geometry and the ESP-IDF project configuration are overridden.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions_16mb.csv

; fetch_micro_opus.py copies sdkconfig.defaults to this active sdkconfig before
; CMake runs. Keep sdkconfig_defaults too for transparency, but sdkconfig is the
; authoritative input so board defaults cannot silently force 160 MHz/no PSRAM.
board_build.sdkconfig = sdkconfig
board_build.sdkconfig_defaults = sdkconfig.defaults
extra_scripts = pre:fetch_micro_opus.py
