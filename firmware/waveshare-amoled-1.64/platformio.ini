[platformio]
default_envs = waveshare-v2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

# main_v07.cpp includes the proven main.cpp once and replaces only setup/loop
# with the two-stage AMOLED idle policy. Exclude main.cpp as a standalone unit.
build_src_filter =
    +<*>
    -<main.cpp>
    -<main_production.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP32QSPI_FREQUENCY=80000000
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=4096

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.7

[env:waveshare-v2]
build_flags =
    ${env.build_flags}
    -DVISITESCRIBE_BOARD_REV=2

[env:waveshare-v1]
build_flags =
    ${env.build_flags}
    -DVISITESCRIBE_BOARD_REV=1


; Production recorder: real dual-IM73D122 PDM audio + production session files
; + automatic VSUSB v1 PC sync. Existing UI/lab builds remain untouched.
[env:waveshare-v2-production]
build_flags =
    ${env.build_flags}
    -DVISITESCRIBE_BOARD_REV=2
build_src_filter =
    -<*>
    +<main_production.cpp>
