[platformio]
default_envs = cores3-lite

[env:cores3-lite]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
    -<*>
    +<main_v064.cpp>

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DM5GFX_BOARD=10
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/m5stack/M5GFX.git#641944bd5b123e42b6f4379ff16768e292e203d1
    https://github.com/m5stack/M5Unified.git#e79eb6e3137a41e50b0ec23c8c38738bdb3a11e2

; Minimal hardware/display diagnostic for CoreS3-Lite + M5GO Bottom3.
; No recorder, SD, Wi-Fi, sync or Opus code is linked.
[env:cores3-lite-bottom3-diag]
extends = env:cores3-lite
build_src_filter =
    -<*>
    +<main_bottom3_diag.cpp>

; Experimental only. Production stays on [env:cores3-lite] with no Opus
; dependency. This environment proves encoder speed/size on the exact board
; before the server ingest format is changed.
; Demo firmware: production recorder + clean UI + fast 12 kHz mono G.711 mu-law sync.
; The 48 kHz stereo WAV master remains unchanged on microSD.
[env:cores3-lite-demo]
extends = env:cores3-lite
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_DEMO_UI=1
    -DVISITESCRIBE_DEMO_MULAW_SYNC=1

[env:cores3-lite-opus-test]
extends = env:cores3-lite
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_OPUS_EXPERIMENT=1
lib_deps =
    ${env:cores3-lite.lib_deps}
    sh123/esp32_opus@1.0.3

; Experimental live-load stress test. Uses Espressif's official prebuilt Opus
; encoder v2.5.0 on the existing Arduino/ESP-IDF production stack. The OPUS TEST
; menu button only starts/pauses a synthetic real-time encoder load on Core 0;
; the actual 48 kHz stereo master WAV recording path is not modified.
[env:cores3-lite-opus-esp-load]
extends = env:cores3-lite
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_OPUS_EXPERIMENT=1
    -DVISITESCRIBE_OPUS_ESP_LOAD_EXPERIMENT=1
extra_scripts =
    pre:fetch_esp_audio_codec.py
lib_deps =
    ${env:cores3-lite.lib_deps}
