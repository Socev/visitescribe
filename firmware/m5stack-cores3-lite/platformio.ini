[platformio]
default_envs = cores3-lite

[env:cores3-lite]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
    -<*>
    +<main_v064.cpp>

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DM5GFX_BOARD=10
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/m5stack/M5GFX.git#641944bd5b123e42b6f4379ff16768e292e203d1
    https://github.com/m5stack/M5Unified.git#e79eb6e3137a41e50b0ec23c8c38738bdb3a11e2

; Minimal hardware/display diagnostic for CoreS3-Lite + M5GO Bottom3.
; No recorder, SD, Wi-Fi, sync or Opus code is linked.
[env:cores3-lite-bottom3-diag]
extends = env:cores3-lite
build_src_filter =
    -<*>
    +<main_bottom3_diag.cpp>

; Experimental only. Production stays on [env:cores3-lite] with no Opus
; dependency. This environment proves encoder speed/size on the exact board
; before the server ingest format is changed.
; Demo firmware: production recorder + clean UI.
; Sync stays on the proven/current API-compatible 16 kHz mono PCM path.
; The 48 kHz stereo WAV master remains unchanged on microSD.
[env:cores3-lite-demo]
extends = env:cores3-lite
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_DEMO_UI=1

[env:cores3-lite-opus-test]
extends = env:cores3-lite
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_OPUS_EXPERIMENT=1
lib_deps =
    ${env:cores3-lite.lib_deps}
    sh123/esp32_opus@1.0.3

; Experimental live-load stress test. Uses Espressif's official prebuilt Opus
; encoder v2.5.0 on the existing Arduino/ESP-IDF production stack. The OPUS TEST
; menu button only starts/pauses a synthetic real-time encoder load on Core 0;
; the actual 48 kHz stereo master WAV recording path is not modified.
[env:cores3-lite-opus-esp-load]
extends = env:cores3-lite
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_OPUS_EXPERIMENT=1
    -DVISITESCRIBE_OPUS_ESP_LOAD_EXPERIMENT=1
extra_scripts =
    pre:fetch_esp_audio_codec.py
lib_deps =
    ${env:cores3-lite.lib_deps}


; Experimental direct recorder: no PCM/WAV master is written.
; 48 kHz stereo capture is immediately downmixed/decimated to 16 kHz mono,
; encoded as 24 kbit/s VBR Opus, and stored as self-contained <=30 s Ogg
; chunks. Keep cores3-lite-demo as the proven rollback target until hardware
; validation confirms zero dropped frames and server-valid Ogg granules.
[env:cores3-lite-direct-opus]
extends = env:cores3-lite
; v0.8: fleet layer (NVS identity, setup hotspot, pairing, OTA) on top of the
; v0.6.4 recorder. Development build: copies the networks in wifi_secrets.h
; into NVS on first boot (skipping the hotspot on your own bench). A new Brian
; gets its own ID brian-<mac> and enrols itself.
build_src_filter =
    -<*>
    +<main_v080.cpp>
build_flags =
    ${env:cores3-lite.build_flags}
    -DVISITESCRIBE_DEMO_UI=1
    -DVISITESCRIBE_DIRECT_OPUS=1
extra_scripts =
    pre:fetch_esp_audio_codec.py
lib_deps =
    ${env:cores3-lite.lib_deps}
    bblanchon/ArduinoJson@7.2.1

; ONE-TIME, only for the Brian that is already registered by hand
; (visitescribe-cores3-001): also adopts the device ID and token from
; include/server_secrets.h into NVS, so it keeps its registration. Flash this
; once over USB on that device; never on a new Brian (it would clone the ID).
[env:cores3-lite-migrate]
extends = env:cores3-lite-direct-opus
build_flags =
    ${env:cores3-lite-direct-opus.build_flags}
    -DVISITESCRIBE_MIGRATE_LEGACY_IDENTITY=1

; The image to upload in the admin interface (Firmware). Identical to
; cores3-lite-direct-opus but guaranteed free of compiled-in secrets, so the
; same file can go to every Brian. The version comes from src/firmware_version.h.
;   py -m platformio run -e cores3-lite-release
;   -> .pio/build/cores3-lite-release/firmware.bin
[env:cores3-lite-release]
extends = env:cores3-lite-direct-opus
build_flags =
    ${env:cores3-lite-direct-opus.build_flags}
    -DVISITESCRIBE_RELEASE_BUILD=1
